<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado Front-end · Prova</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;line-height:1.5}
  #app{max-width:640px;margin:0 auto;padding:20px 16px 48px}
  .topo{display:flex;justify-content:space-between;font-size:14px;color:#94a3b8;margin-bottom:8px}
  .barra{height:6px;background:#1e293b;border-radius:99px;overflow:hidden;margin-bottom:20px}
  .barra div{height:100%;background:#38bdf8;transition:width .3s}
  h1{font-size:26px;margin-bottom:8px}
  h2{font-size:19px;font-weight:600;margin-bottom:18px}
  .op{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#1e293b;color:#e2e8f0;border:2px solid #334155;border-radius:12px;padding:14px;margin-bottom:10px;font-size:16px;font-family:inherit;cursor:pointer}
  .op b{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#334155;display:flex;align-items:center;justify-content:center;font-size:14px}
  .op:disabled{cursor:default}
  .op.certa{border-color:#22c55e;background:#14532d}
  .op.certa b{background:#22c55e}
  .op.errada{border-color:#ef4444;background:#7f1d1d}
  .op.errada b{background:#ef4444}
  .exp{background:#1e293b;border-left:4px solid #38bdf8;border-radius:8px;padding:14px;margin:6px 0 16px;font-size:15px}
  .btn{width:100%;background:#38bdf8;color:#0f172a;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
  .centro{text-align:center;padding-top:40px}
  .nota{font-size:72px;font-weight:800;color:#38bdf8;margin:12px 0}
  .info{color:#94a3b8;margin-top:10px}
  .op.marcada{border-color:#38bdf8;background:#0c4a6e}
  .op.marcada b{background:#38bdf8;color:#0f172a}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sec{background:#1e293b;color:#e2e8f0;border:2px solid #334155}
  .nav{display:flex;gap:10px;margin-top:8px}
  .mapa{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .num{width:36px;height:36px;border-radius:8px;border:2px solid #334155;background:#1e293b;color:#94a3b8;font-weight:700;font-family:inherit;cursor:pointer}
  .num.resp{background:#0c4a6e;color:#e2e8f0;border-color:#0c4a6e}
  .num.atual{border-color:#38bdf8}
  .gab{margin-top:40px}
  .rev{background:#111c33;border:2px solid #334155;border-radius:12px;padding:14px;margin-bottom:14px}
  .rev.ok{border-color:#166534}.rev.no{border-color:#991b1b}
  .rt{font-size:14px;color:#94a3b8;margin-bottom:6px}
  .rp{font-weight:600;margin-bottom:10px}
  .ro{padding:8px 10px;border-radius:8px;margin-bottom:6px;background:#1e293b;font-size:15px}
  .ro.certa{background:#14532d}.ro.errada{background:#7f1d1d}
</style>
</head>
<body>
<div id="app"></div>

<script>
const Q=[
/* ===================== HTML ===================== */
{t:"HTML",p:"Qual é a função da linha <!DOCTYPE html> no início do arquivo?",o:["Definir o título exibido na aba","Declarar que o documento segue as regras do HTML5","Incluir a folha de estilos CSS","Criar o elemento raiz do documento","Inserir metadados para buscadores"],c:1,e:"O DOCTYPE avisa ao navegador que a página é HTML5, evitando o modo de compatibilidade (quirks mode)."},
{t:"HTML",p:"Qual é o elemento raiz de um documento HTML?",o:["<head>","<body>","<html>","<main>","<!DOCTYPE>"],c:2,e:"Tudo fica dentro do <html>, inclusive o <head> e o <body>."},
{t:"HTML",p:"Qual tag define o título que aparece na aba do navegador?",o:["<h1>","<title>","<meta>","<head>","<header>"],c:1,e:"O <title> fica dentro do <head>; o <h1> é o título visível no corpo da página."},
{t:"HTML",p:"Para que serve <meta charset='UTF-8'> dentro do <head>?",o:["Definir o título da página","Fazer acentos e caracteres especiais aparecerem corretamente","Vincular o arquivo CSS","Criar uma barra de navegação","Carregar o JavaScript"],c:1,e:"O UTF-8 garante que ç, ã, é etc. apareçam certos."},
{t:"HTML",p:"Qual tag vem logo após o fechamento do <head> e contém todo o conteúdo visível da página?",o:["<h1>","<title>","<meta>","<body>","<footer>"],c:3,e:"O <body> guarda textos, imagens, listas, formulários e tudo o que aparece na tela."},
{t:"HTML",p:"Qual é a função do atributo alt na tag <img>?",o:["Ajustar a altura da imagem","Especificar um texto alternativo, lido por leitores de tela ou exibido se a imagem não carregar","Definir o título que aparece ao passar o mouse","Definir a largura da imagem","Abrir a imagem em nova aba"],c:1,e:"alt é texto alternativo; o texto ao passar o mouse vem do title."},
{t:"HTML",p:"Quais elementos criam um grupo de campos de formulário com uma legenda?",o:["<section> e <h1>","<main> e <header>","<fieldset> e <legend>","<div> e <span>","<form> e <label>"],c:2,e:"<fieldset> agrupa os campos e <legend> dá o título do grupo."},
{t:"HTML",p:"Qual type de botão envia o formulário e seus dados?",o:["type='button'","type='reset'","type='submit'","type='text'","type='radio'"],c:2,e:"submit envia; reset limpa os campos; button não faz nada sozinho."},
{t:"HTML",p:"Qual elemento semântico encapsula o conteúdo principal e exclusivo da página?",o:["<header>","<section>","<main>","<footer>","<aside>"],c:2,e:"<main> aparece uma vez e não inclui cabeçalho, rodapé nem barras laterais."},
{t:"HTML",p:"Qual elemento semântico representa uma seção com links de navegação?",o:["<footer>","<nav>","<article>","<section>","<aside>"],c:1,e:"<nav> marca o menu e os links que levam a outras páginas ou áreas."},
{t:"HTML",p:"Qual elemento define um conteúdo ao lado do principal, como barra lateral ou propagandas?",o:["<article>","<header>","<aside>","<footer>","<section>"],c:2,e:"<aside> é para conteúdo complementar, relacionado indiretamente ao principal."},
{t:"HTML",p:"Qual elemento representa o rodapé, com direitos autorais ou links relacionados?",o:["<header>","<main>","<footer>","<section>","<nav>"],c:2,e:"<footer> é o rodapé da página ou de uma seção."},
{t:"HTML",p:"Qual elemento representa um conteúdo independente, como um post ou uma notícia?",o:["<article>","<aside>","<div>","<span>","<nav>"],c:0,e:"<article> faz sentido sozinho, mesmo fora da página."},
{t:"HTML",p:"Qual elemento e atributos vinculam uma folha de estilos CSS externa?",o:["<meta> com href","<title> com rel","<link> com rel e href","<a> com href","<html> com style"],c:2,e:"Exemplo: <link rel='stylesheet' href='css/estilos.css'> dentro do <head>."},
{t:"HTML",p:"Qual o significado de rel='stylesheet' na tag <link>?",o:["Indica o caminho do arquivo CSS","Define a codificação de caracteres","Indica que o recurso vinculado é uma folha de estilos","Define o título da página","Ativa o JavaScript"],c:2,e:"rel descreve a relação; o caminho do arquivo fica no href."},
{t:"HTML",p:"Qual afirmação melhor diferencia os atributos id e class?",o:["class é para um único elemento; id para vários","id identifica um único elemento; class aplica estilo a vários","Os dois devem ser únicos na página","id é obrigatório em todo elemento","id só funciona no CSS e class só no JS"],c:1,e:"id é único (links internos, JS); class se repete em vários elementos."},
{t:"HTML",p:"Qual tag insere uma imagem na página?",o:["<img>","<image>","<pic>","<src>","<figure>"],c:0,e:"<img> usa src e alt; <figure> só agrupa imagem e legenda."},
{t:"HTML",p:"Qual atributo da <img> indica o arquivo da imagem?",o:["href","src","alt","link","file"],c:1,e:"src aponta o arquivo; alt é o texto alternativo."},
{t:"HTML",p:"Qual tag cria uma LINHA de tabela?",o:["<td>","<th>","<tr>","<table>","<row>"],c:2,e:"<tr> é a linha; <td> é a célula; <th> é a célula de cabeçalho."},
{t:"HTML",p:"Qual atributo faz um link abrir em uma nova aba?",o:["target='_blank'","href='_new'","rel='tab'","open='new'","new-tab"],c:0,e:"target='_blank' abre o destino em outra aba."},
{t:"HTML",p:"Qual tag cria uma caixa de texto com várias linhas?",o:["<input type='text'>","<textarea>","<text>","<p>","<field>"],c:1,e:"<textarea> aceita várias linhas; o input text aceita só uma."},
{t:"HTML",p:"Qual tag cria uma lista suspensa de opções?",o:["<list>","<option>","<select>","<dropdown>","<datalist>"],c:2,e:"<select> é a lista; cada item dentro dela é uma <option>."},
{t:"HTML",p:"Qual type de input permite escolher só UMA opção de um grupo?",o:["checkbox","radio","select","button","option"],c:1,e:"radio com o mesmo name = uma escolha; checkbox permite várias."},
{t:"HTML",p:"Qual atributo mostra uma dica dentro do campo enquanto ele está vazio?",o:["value","title","placeholder","label","hint"],c:2,e:"placeholder some quando o usuário começa a digitar."},
{t:"HTML",p:"Qual atributo do <form> define para onde os dados são enviados?",o:["method","action","target","href","send"],c:1,e:"action é o destino; method define GET ou POST."},
{t:"HTML",p:"Qual tag indica texto de forte importância (negrito semântico)?",o:["<b>","<strong>","<em>","<bold>","<i>"],c:1,e:"<strong> tem significado; <b> é só visual; <em> é ênfase."},
{t:"HTML",p:"Qual tag cria uma quebra de linha?",o:["<hr>","<lb>","<br>","<p>","<break>"],c:2,e:"<br> quebra a linha; <hr> desenha uma linha horizontal."},
{t:"HTML",p:"Onde colocar o script para não atrasar a exibição do HTML?",o:["No início do <head>, sem atributos","No final do <body>","Antes do <!DOCTYPE>","Dentro do <title>","Dentro do <style>"],c:1,e:"No fim do body (ou com defer), o HTML aparece antes de o JS rodar."},
{t:"HTML",p:"Qual tag representa o cabeçalho VISÍVEL de uma página ou seção?",o:["<head>","<header>","<top>","<h1>","<nav>"],c:1,e:"<header> aparece na tela; <head> guarda metadados invisíveis."},
{t:"HTML",p:"Qual tag cria um rótulo associado a um campo de formulário?",o:["<legend>","<label>","<caption>","<title>","<span>"],c:1,e:"<label for='email'> se liga ao campo com id='email'."},
{t:"HTML",p:"Qual tag cria uma lista NUMERADA?",o:["<ul>","<ol>","<li>","<dl>","<list>"],c:1,e:"<ol> é ordenada (numerada); <ul> usa marcadores; <li> é cada item."},
{t:"HTML",p:"Qual tag cria um link clicável para outra página?",o:["<link>","<a>","<href>","<url>","<nav>"],c:1,e:"<a href='...'> é o link clicável; <link> vincula arquivos no <head>."},
{t:"HTML",p:"Qual sequência de tags representa o título de MAIOR e o de MENOR importância, respectivamente?",o:["<h2> e <h5>","<h1> e <h6>","<title> e <h1>","<h6> e <h1>","<p> e <h1>"],c:1,e:"Os títulos vão do <h1> (mais importante) até o <h6> (menos importante)."},
{t:"HTML",p:"Quais tags aplicam ITÁLICO e NEGRITO ao texto, respectivamente?",o:["<title> e <h1>","<b> e <i>","<br/> e <p>","<ol> e <li>","<i> e <b>"],c:4,e:"<i> = itálico; <b> = negrito (bold). Atenção à ordem pedida: itálico primeiro."},
{t:"HTML",p:"Qual marcador terão os itens de uma lista <ol type=\"A\">?",o:["Letras maiúsculas (A, B, C...)","Números arábicos (1, 2, 3...)","Romanos minúsculos (i, ii, iii...)","Símbolos (bolinhas, quadrados...)","Letras minúsculas (a, b, c...)"],c:0,e:"type=\"A\" usa letras maiúsculas; type=\"a\" usaria minúsculas."},
{t:"HTML",p:"Uma lista <ol type=\"i\"> resultará em qual numeração?",o:["Letras maiúsculas (A, B, C...)","Algarismos romanos minúsculos (i, ii, iii...)","Algarismos romanos maiúsculos (I, II, III...)","Números arábicos (1, 2, 3...)","Letras minúsculas (a, b, c...)"],c:1,e:"type=\"i\" = romanos minúsculos; type=\"I\" = romanos maiúsculos."},
{t:"HTML",p:"O que acontece ao usar várias tags <br /> seguidas, como <br /><br />?",o:["O texto seguinte fica em negrito","O navegador entende como um novo parágrafo (<p>)","Cada tag insere uma quebra de linha, aumentando o espaço vertical","O código é inválido e o navegador mostra erro","O navegador ignora as repetidas e faz só uma quebra"],c:2,e:"Cada <br /> é uma quebra de linha; duas seguidas deixam uma linha em branco."},
{t:"HTML",p:"Qual tag define um PARÁGRAFO e qual força uma QUEBRA DE LINHA simples dentro dele?",o:["<br/> e <h1>","<i> e <b>","<p> e <li>","<p> e <br/>","<body> e <p>"],c:3,e:"<p> cria o parágrafo; <br/> quebra a linha dentro dele."},
{t:"HTML",p:"Qual é a finalidade da estrutura <\!-- ... --\> em um documento HTML?",o:["Inserir um hiperlink","Marcar o início e o fim de um parágrafo","Definir um bloco de código JavaScript","Adicionar anotações ignoradas pelo navegador e não exibidas ao usuário","Criar uma quebra de linha"],c:3,e:"É o comentário do HTML. Em CSS e JS multilinha o comentário é /* ... */."},
{t:"HTML",p:"Quais tags definem a estrutura básica do documento, delimitando o conteúdo que será exibido?",o:["<head> e <title>","<html> e <body>","<h1> e <p>","<li> e <ol>","<br/> e <p>"],c:1,e:"<html> envolve todo o documento e <body> guarda o conteúdo visível."},
{t:"HTML",p:"Quais atributos da <img> definem a LARGURA e a ALTURA, respectivamente?",o:["size e depth","width e height","x e y","h-size e w-size","src e alt"],c:1,e:"width = largura; height = altura."},
{t:"HTML",p:"Qual é o propósito semântico das tags <figure> e <figcaption>?",o:["Criar uma galeria de imagens","<figure> cria um bloco de conteúdo autocontido e <figcaption> define a legenda da imagem","Apenas aplicar estilos CSS","Transformar a imagem em link","Otimizar o carregamento da imagem"],c:1,e:"<figure> agrupa a imagem; <figcaption> é a legenda dela."},
{t:"HTML",p:"Qual tag cria um campo de entrada de texto de LINHA ÚNICA (como nome ou e-mail)?",o:["<textarea>","<select>","<datalist>","<input type=\"text\">","<input type=\"number\">"],c:3,e:"<textarea> é para várias linhas; <input type=\"text\"> é linha única."},
{t:"HTML",p:"Qual atributo limita o número MÁXIMO de caracteres digitados em um campo de texto?",o:["rows","cols","size","value","maxlength"],c:4,e:"Ex.: maxlength=\"10\". rows e cols são do <textarea>; size só muda a largura visível."},

/* ===================== CSS ===================== */
{t:"CSS",p:"Qual alternativa melhor define o CSS?",o:["Linguagem de programação para lógica e interatividade","Sistema de banco de dados","Linguagem de marcação que define a estrutura da página","Substituto do HTML para celulares","Linguagem de estilos que define a apresentação visual e separa o estilo do conteúdo"],c:4,e:"Estrutura é HTML, lógica é JavaScript e aparência é CSS."},
{t:"CSS",p:"Um parágrafo e um botão têm class='texto'. Qual é o principal uso do seletor .texto?",o:["Navegação por links internos","Identificar um elemento único","Aplicar um estilo reutilizável a vários elementos","Criar um cabeçalho ou rodapé","Ter mais especificidade que um id"],c:2,e:"Classe serve para reaproveitar estilo; id é para um elemento único."},
{t:"CSS",p:"Qual é a ordem do Modelo de Caixa, de DENTRO para FORA?",o:["Borda, padding, conteúdo, margin","Margin, borda, padding, conteúdo","Conteúdo, margin, borda, padding","Conteúdo, padding, borda, margin","Margin, conteúdo, padding, borda"],c:3,e:"Conteúdo, depois padding, depois borda e, por fora, margin."},
{t:"CSS",p:"Qual é o propósito da propriedade padding?",o:["Criar espaço externo ao redor da borda","Definir a cor de fundo","Definir o espaço interno entre o conteúdo e a borda","Determinar largura e altura","Alinhar o texto ao centro"],c:2,e:"padding fica dentro da borda; margin fica fora."},
{t:"CSS",p:"Qual é o propósito da propriedade margin?",o:["Definir a espessura da borda","Criar o espaço externo ao redor da borda, separando o elemento dos outros","Mudar a fonte do texto","Controlar o preenchimento interno","Redimensionar imagens"],c:1,e:"margin é a camada mais externa do modelo de caixa."},
{t:"CSS",p:"Em margin: 10px 20px 5px 15px; qual é a ordem dos valores?",o:["Esquerda, direita, superior, inferior","Superior, inferior, esquerda, direita","Superior, direita, inferior, esquerda","Inferior, superior, direita, esquerda","Central, superior, inferior, lateral"],c:2,e:"Sentido horário a partir do topo: TRouBLe (Top, Right, Bottom, Left)."},
{t:"CSS",p:"Qual é o efeito de width: 300px; e height: 200px; em uma div?",o:["Define a margin do elemento","Muda o tamanho da fonte","Define o tamanho da área de conteúdo: 300px por 200px","Faz o elemento virar inline","Define a distância entre conteúdo e borda"],c:2,e:"No padrão (content-box), width e height medem só o conteúdo."},
{t:"CSS",p:"Qual propriedade aplica uma cor de fundo a um elemento?",o:["color","border-color","background-image","background-color","text-decoration"],c:3,e:"color muda o texto; background-image coloca imagem de fundo."},
{t:"CSS",p:"Qual é o propósito das Media Queries?",o:["Criar variáveis globais de cor","Testar se o navegador suporta flex","Aplicar regras CSS só quando certas condições do dispositivo são atendidas","Incluir padding e borda no width","Controlar o carregamento de vídeos"],c:2,e:"Media queries são a base do design responsivo (largura, orientação etc.)."},
{t:"CSS",p:"Qual característica é verdadeira para um elemento com display: block?",o:["Aceita width e height, mas não quebra a linha","Só pode conter elementos inline","Ocupa só a largura do conteúdo","Ocupa toda a largura disponível e aceita width e height","É removido do fluxo do documento"],c:3,e:"Block começa em nova linha e ocupa a largura toda."},
{t:"CSS",p:"Ao aplicar display: flex em uma div, o que acontece com os filhos diretos?",o:["Viram block empilhados verticalmente","São posicionados de forma absoluta","Viram itens flexíveis, alinhados lado a lado por padrão","Têm as margens colapsadas e centralizadas","Viram inline e não aceitam width"],c:2,e:"O padrão do flex é flex-direction: row."},
{t:"CSS",p:"Qual position deixa o elemento sempre visível no mesmo lugar, mesmo rolando a página?",o:["relative","absolute","sticky","fixed","static"],c:3,e:"fixed prende na tela; sticky só gruda depois de um ponto de rolagem."},
{t:"CSS",p:"Qual seletor seleciona o elemento com id 'menu'?",o:[".menu","#menu","menu","*menu","@menu"],c:1,e:"# seleciona id; . seleciona classe; o nome puro seleciona a tag."},
{t:"CSS",p:"Qual propriedade muda a cor do TEXTO?",o:["font-color","text-color","color","background-color","fill"],c:2,e:"color muda o texto; background-color muda o fundo."},
{t:"CSS",p:"Com box-sizing: border-box, o width passa a incluir:",o:["Só o conteúdo","Conteúdo, padding e borda","Conteúdo e margin","Apenas a margin","Nada muda"],c:1,e:"border-box põe padding e borda dentro do width; a margin continua fora."},
{t:"CSS",p:"No flexbox, qual propriedade alinha os itens no eixo PRINCIPAL?",o:["align-items","justify-content","flex-wrap","align-content","text-align"],c:1,e:"justify-content atua no eixo principal; align-items, no eixo cruzado."},
{t:"CSS",p:"Qual valor de flex-direction empilha os itens na vertical?",o:["row","column","wrap","vertical","stack"],c:1,e:"column organiza em coluna; row (padrão) organiza lado a lado."},
{t:"CSS",p:"Qual seletor tem a MAIOR especificidade?",o:["p","*",".texto","#titulo","div p"],c:3,e:"A ordem é id > classe > tag; o * não tem especificidade."},
{t:"CSS",p:"Qual pseudo-classe aplica estilo quando o mouse passa sobre o elemento?",o:[":active",":focus",":hover",":visited","::before"],c:2,e:":hover é mouse em cima; :focus é selecionado; :active é no clique."},
{t:"CSS",p:"Qual unidade é relativa à fonte do elemento raiz (html)?",o:["px","em","rem","%","vh"],c:2,e:"rem usa a fonte do html; em usa a do próprio elemento ou do pai."},
{t:"CSS",p:"Qual é o display padrão de um <span>?",o:["block","inline","flex","none","grid"],c:1,e:"<span> é inline; <div> e <p> são block."},
{t:"CSS",p:"Qual regra esconde o elemento E remove o espaço que ele ocupava?",o:["visibility: hidden","opacity: 0","display: none","position: fixed","z-index: -1"],c:2,e:"visibility: hidden e opacity: 0 escondem, mas mantêm o espaço."},
{t:"CSS",p:"Qual propriedade define qual elemento fica por cima quando se sobrepõem?",o:["z-index","order","layer","top","float"],c:0,e:"z-index funciona em elementos com position diferente de static."},
{t:"CSS",p:"Com @media (max-width: 600px), os estilos valem quando a tela tem:",o:["Mais de 600px","Até 600px","Exatamente 600px","Qualquer largura","Orientação paisagem"],c:1,e:"max-width = até aquele tamanho; min-width = a partir dele."},
{t:"CSS",p:"Qual propriedade define o tamanho da fonte?",o:["font-size","text-size","font-weight","size","font-style"],c:0,e:"font-size é o tamanho; font-weight é a espessura."},
{t:"CSS",p:"Como deixar um texto em negrito com CSS?",o:["font-style: bold","font-weight: bold","text-decoration: bold","font: strong","text-weight: bold"],c:1,e:"font-weight controla o negrito; font-style, o itálico."},
{t:"CSS",p:"Qual propriedade arredonda os cantos de um elemento?",o:["border-style","corner","border-radius","round","radius"],c:2,e:"border-radius: 50% em um quadrado gera um círculo."},

const POR_PROVA=14, VALOR=100;
const app=document.getElementById("app");
let fila=[],lista,i,resp,prova=0;

function embaralhar(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function fmt(n){return (Math.round(n*100)/100).toString().replace(".",",")}
const PTS=VALOR/POR_PROVA;

function inicio(){
  app.innerHTML="";
  const c=el("div","centro");
  c.append(
    el("h1","","Simulado Front-end"),
    el("p","info","HTML · CSS · JavaScript · DOM"),
    el("p","info","Formato da prova: "+POR_PROVA+" questões, valendo "+VALOR+" pontos ("+fmt(PTS)+" pts cada)."),
    el("p","info","Responda todas, pode voltar e trocar respostas. O gabarito só aparece depois de entregar."),
    el("p","info",Q.length+" questões no banco; cada prova sorteia questões inéditas até acabar o banco.")
  );
  const b=el("button","btn","Começar prova");b.style.marginTop="28px";b.onclick=iniciar;
  c.append(b);app.append(c);
}

function iniciar(){
  if(fila.length<POR_PROVA) fila=fila.concat(embaralhar(Q.filter(q=>!fila.includes(q))));
  prova++;
  lista=fila.splice(0,POR_PROVA).map(q=>({...q,ops:embaralhar(q.o.map((t,k)=>({t,ok:k===q.c})))}));
  resp=new Array(lista.length).fill(null);
  i=0;mostrar();
}

function mapa(){
  const m=el("div","mapa");
  lista.forEach((_,k)=>{
    const b=el("button","num"+(resp[k]!==null?" resp":"")+(k===i?" atual":""),String(k+1));
    b.onclick=()=>{i=k;mostrar()};m.append(b);
  });
  return m;
}

function mostrar(){
  const q=lista[i];app.innerHTML="";
  const feitas=resp.filter(r=>r!==null).length;
  const topo=el("div","topo");
  topo.append(el("span","","Prova "+prova+" · "+q.t+" · "+fmt(PTS)+" pts"),el("span","",feitas+" / "+lista.length+" respondidas"));
  const barra=el("div","barra");const p=el("div");p.style.width=(feitas/lista.length*100)+"%";barra.append(p);
  app.append(topo,barra,mapa(),el("h2","","Questão "+(i+1)+". "+q.p));
  q.ops.forEach((op,k)=>{
    const b=el("button","op"+(resp[i]===k?" marcada":""));b.append(el("b","","ABCDE"[k]),el("span","",op.t));
    b.onclick=()=>{resp[i]=k;mostrar()};app.append(b);
  });
  const nav=el("div","nav");
  const ant=el("button","btn sec","Anterior");ant.disabled=i===0;ant.onclick=()=>{i--;mostrar()};
  const ult=i===lista.length-1;
  const prox=el("button","btn",ult?"Entregar prova":"Próxima");
  prox.onclick=()=>{ult?confirmar():(i++,mostrar())};
  nav.append(ant,prox);app.append(nav);
  if(!ult){const ent=el("button","btn sec","Entregar prova");ent.style.marginTop="10px";ent.onclick=confirmar;app.append(ent)}
  window.scrollTo(0,0);
}

function confirmar(){
  const falta=resp.map((r,k)=>r===null?k+1:null).filter(x=>x);
  if(!falta.length)return corrigir();
  app.innerHTML="";const c=el("div","centro");
  c.append(el("h1","","Entregar a prova?"),
    el("p","","Você deixou "+falta.length+" questão(ões) em branco: "+falta.join(", ")+"."),
    el("p","info","Questões em branco valem zero."));
  const v=el("button","btn","Voltar e responder");v.style.marginTop="24px";v.onclick=()=>{i=falta[0]-1;mostrar()};
  const e=el("button","btn sec","Entregar mesmo assim");e.style.marginTop="10px";e.onclick=corrigir;
  c.append(v,e);app.append(c);window.scrollTo(0,0);
}

function corrigir(){
  const acertos=lista.filter((q,k)=>resp[k]!==null&&q.ops[resp[k]].ok).length;
  const nota=acertos*PTS;
  app.innerHTML="";const c=el("div","centro");
  c.append(
    el("h1","","Resultado da prova "+prova),
    el("div","nota",fmt(nota)),
    el("p","","de "+VALOR+" pontos · "+acertos+" de "+lista.length+" questões certas"),
    el("p","info",fila.length>0?"Ainda faltam "+fila.length+" questões inéditas no banco.":"Você viu todas as questões! A próxima prova embaralha tudo de novo.")
  );
  const r=el("button","btn","Nova prova");r.style.marginTop="24px";r.onclick=iniciar;
  c.append(r);app.append(c);
  app.append(el("h2","gab","Gabarito comentado"));
  lista.forEach((q,k)=>{
    const ok=resp[k]!==null&&q.ops[resp[k]].ok;
    const box=el("div","rev "+(ok?"ok":"no"));
    box.append(el("p","rt",(ok?"✅ ":"❌ ")+"Questão "+(k+1)+" · "+q.t+" · "+(ok?"+"+fmt(PTS):"0")+" pts"));
    box.append(el("p","rp",q.p));
    q.ops.forEach((op,j)=>{
      const cls="ro"+(op.ok?" certa":"")+(resp[k]===j&&!op.ok?" errada":"");
      box.append(el("div",cls,"ABCDE"[j]+") "+op.t+(resp[k]===j?"  ← sua resposta":"")));
    });
    if(resp[k]===null)box.append(el("p","info","Deixou em branco."));
    box.append(el("div","exp",q.e));
    app.append(box);
  });
  const r2=el("button","btn","Nova prova");r2.onclick=iniciar;app.append(r2);
  window.scrollTo(0,0);
}

inicio();
</script>
